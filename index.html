:root{--navy:#14304f;--red:#a31f18;--sky:#1f6f9f;--gold:#e9a22b;--paper:#f7edd1;--ink:#2b2418;--green:#2f8f4e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Nunito,system-ui,sans-serif;font-weight:600;color:var(--ink);min-height:100vh;overflow-x:hidden;
 background:linear-gradient(180deg,#5fb4ea 0%,#a8dcf5 38%,#e9f6fb 62%,#f4dfae 82%,#e8c27a 100%);background-attachment:fixed}
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.clouds i{position:absolute;left:-30%;width:200px;height:56px;background:#fff;border-radius:60px;opacity:.85;filter:blur(1px);animation:drift linear infinite}
.clouds i:before,.clouds i:after{content:"";position:absolute;background:#fff;border-radius:50%}
.clouds i:before{width:84px;height:84px;left:28px;top:-40px}.clouds i:after{width:64px;height:64px;left:90px;top:-26px}
@keyframes drift{to{transform:translateX(160vw)}}
main{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:16px 14px 70px}
.screen{display:none}.screen.on{display:block;animation:rise .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
h1,h2,.lil{font-family:Lilita,Nunito,sans-serif;font-weight:400}
/* HOME */
.poster{text-align:center;padding-top:4px}
.ribbon{display:inline-block;background:var(--navy);color:#ffe7a8;font-family:Lilita;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;padding:6px 22px;position:relative;box-shadow:0 3px 0 #0003}
.ribbon:before,.ribbon:after{content:"";position:absolute;top:0;border:15px solid #0e2338;z-index:-1}
.ribbon:before{left:-18px;border-left-color:transparent}.ribbon:after{right:-18px;border-right-color:transparent}
h1{font-size:clamp(2.5rem,11vw,4.2rem);line-height:.95;color:var(--red);margin:14px 0 6px;text-shadow:0 3px 0 #fff,0 6px 0 #0002}
h1 span{display:block;color:var(--navy)}
.sub{color:var(--navy);font-weight:700;margin:6px 8px 12px}
.porthole{width:min(300px,72vw);aspect-ratio:1;margin:8px auto 12px;border-radius:50%;padding:10px;background:conic-gradient(#d9a441,#f6dc8f,#b57d1c,#f6dc8f,#d9a441);box-shadow:0 10px 26px #0004,inset 0 0 0 3px #7a5410}
.porthole img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:5px solid #5a3d0b;display:block}
.hint{font-family:Lilita;color:var(--navy);letter-spacing:.06em;text-transform:uppercase;margin:16px 0 8px;font-size:1.05rem;text-align:center}
.tiles{display:grid;gap:12px}
.tile{display:flex;align-items:stretch;border:0;background:var(--paper);border-radius:12px;text-align:left;cursor:pointer;box-shadow:0 5px 0 #0003;overflow:hidden;position:relative;min-height:74px;font-family:inherit;color:var(--ink);transition:transform .12s}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 #0003}
.tile .stub{width:78px;flex:none;background:var(--red);color:#fff;display:grid;place-items:center;text-align:center;font-family:Lilita;position:relative}
.tile:nth-child(even) .stub{background:var(--navy)}
.tile .stub small{display:block;font-size:.62rem;letter-spacing:.14em;opacity:.85}.tile .stub b{font-size:1.7rem;font-weight:400;line-height:1}
.tile .stub:after{content:"";position:absolute;right:-1px;top:6px;bottom:6px;border-right:3px dotted var(--paper)}
.tile .mid{padding:10px 12px;display:flex;flex-direction:column;justify-content:center;flex:1}
.tile .mid b{font-family:Lilita;font-weight:400;font-size:1.1rem;line-height:1.1;color:var(--navy)}
.tile .mid span{font-size:.78rem;opacity:.75;margin-top:2px}
.tile .em{font-size:1.8rem;display:grid;place-items:center;padding:0 12px}
.tile .pin{position:absolute;right:8px;top:4px;font-size:1.1rem}
.go{display:block;width:100%;margin-top:16px;padding:15px;border:0;border-radius:14px;font-family:Lilita;font-size:1.25rem;letter-spacing:.04em;color:#fff;background:linear-gradient(#d4382f,var(--red));box-shadow:0 6px 0 #5e100c;cursor:pointer}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #5e100c}
.go.alt{background:linear-gradient(#2a6aa0,var(--navy));box-shadow:0 6px 0 #0a1c30}
.foot{text-align:center;font-size:.78rem;color:#4a3d22;opacity:.8;margin-top:22px}
/* PLAY */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:0;background:var(--navy);color:#fff;border-radius:10px;padding:8px 12px;font-family:Lilita;font-size:.95rem;cursor:pointer;box-shadow:0 3px 0 #0a1c30}
.sc{font-family:Lilita;background:var(--gold);color:var(--navy);padding:6px 12px;border-radius:10px;box-shadow:0 3px 0 #9a6a10;white-space:nowrap}
.track{flex:1;height:44px;position:relative;margin-left:26px}
.track:before{content:"";position:absolute;left:0;right:0;top:26px;border-top:4px dotted #fff;opacity:.95}
.track .done{position:absolute;left:0;top:25px;height:6px;background:var(--red);border-radius:4px;width:0;transition:width .5s}
.plane{position:absolute;top:2px;left:0;width:64px;transition:left .5s cubic-bezier(.3,1.3,.5,1);transform:translateX(-30%)}
.plane svg{width:100%;display:block;filter:drop-shadow(0 3px 2px #0004)}
.flag{position:absolute;right:-2px;top:4px;font-size:1.3rem}
.tele{background:var(--paper);border-radius:6px;box-shadow:0 10px 24px #0004;position:relative;padding:0 0 18px;
 background-image:repeating-linear-gradient(0deg,transparent 0 27px,#0000000d 27px 28px);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),97% 100%,94% calc(100% - 10px),91% 100%,88% calc(100% - 10px),85% 100%,82% calc(100% - 10px),79% 100%,76% calc(100% - 10px),73% 100%,70% calc(100% - 10px),67% 100%,64% calc(100% - 10px),61% 100%,58% calc(100% - 10px),55% 100%,52% calc(100% - 10px),49% 100%,46% calc(100% - 10px),43% 100%,40% calc(100% - 10px),37% 100%,34% calc(100% - 10px),31% 100%,28% calc(100% - 10px),25% 100%,22% calc(100% - 10px),19% 100%,16% calc(100% - 10px),13% 100%,10% calc(100% - 10px),7% 100%,4% calc(100% - 10px),1% 100%,0 calc(100% - 10px))}
.tele .hd{background:var(--navy);color:#ffe7a8;font-family:"Special Elite",monospace;font-size:.78rem;letter-spacing:.12em;padding:7px 14px;display:flex;justify-content:space-between;gap:10px}
.tele .bd{padding:14px 16px 0}
.rn{font-family:"Special Elite",monospace;font-size:.8rem;color:var(--red)}
.qt{font-family:"Special Elite",monospace;font-size:clamp(1.15rem,4.8vw,1.5rem);line-height:1.3;margin:8px 0 14px;color:var(--ink)}
.opts{display:grid;gap:10px}
.opt{border:3px solid var(--navy);background:#fffaf0;border-radius:12px;padding:10px 12px;display:flex;gap:12px;align-items:center;text-align:left;font-family:Nunito;font-weight:800;font-size:1.04rem;color:var(--navy);cursor:pointer;box-shadow:0 4px 0 var(--navy);position:relative}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:Lilita;font-size:1.1rem;color:#fff;background:radial-gradient(circle at 35% 30%,#f6dc8f,#b57d1c);box-shadow:inset 0 0 0 2px #7a5410;text-shadow:0 1px 0 #7a5410}
.opt.right{background:#dff5e3;border-color:var(--green);box-shadow:0 4px 0 var(--green);animation:pulse .5s}
.opt.right,.opt.wrong{padding-bottom:26px}.opt.right:after{content:"CLEARED";position:absolute;right:8px;bottom:4px;transform:rotate(-4deg);font-family:Lilita;font-size:.8rem;letter-spacing:.1em;color:var(--green);border:2px solid var(--green);border-radius:6px;padding:1px 6px;background:#ffffffcc}
.opt.wrong{background:#fde4e0;border-color:var(--red);box-shadow:0 4px 0 var(--red);animation:shake .4s}
.opt.wrong:after{content:"TURBULENCE";position:absolute;right:8px;bottom:4px;transform:rotate(3deg);font-family:Lilita;font-size:.72rem;letter-spacing:.08em;color:var(--red);border:2px solid var(--red);border-radius:6px;padding:1px 6px;background:#ffffffcc}
.opts.done .opt{pointer-events:none}.opts.done .opt:not(.right):not(.wrong){opacity:.5}
@keyframes pulse{40%{transform:scale(1.03)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fb{display:none;margin:14px 16px 0;padding:10px 12px;border-left:6px solid var(--gold);background:#fff3cf;font-size:.98rem}
.fb.on{display:block;animation:rise .3s}
.fb b{display:block;font-family:Lilita;font-weight:400;font-size:1.15rem;color:var(--red);margin-bottom:2px}
.fb .stop{font-family:"Special Elite",monospace;font-size:.72rem;letter-spacing:.14em;color:#7a6a3a;display:block;margin-top:6px}
.streak{color:var(--navy)}
#nx{display:none}
/* END */
.cert{background:#fffaf0;border:6px double var(--navy);border-radius:10px;padding:22px 16px;text-align:center;box-shadow:0 12px 30px #0005;position:relative}
.cert:before{content:"";position:absolute;inset:6px;border:2px solid var(--gold);border-radius:6px;pointer-events:none}
.cert .k{font-family:"Special Elite",monospace;letter-spacing:.2em;font-size:.72rem;color:#6c5a26}
.cert h2{font-size:2rem;color:var(--red);margin:6px 0}
.cert .big{font-family:Lilita;font-size:3.4rem;color:var(--navy);line-height:1;margin:4px 0}

<script>
const ROUNDS=[{"t": "A Dream That Wouldn't Die", "e": "🌅", "q": [{"q": "What did the Wright brothers dream of doing?", "o": ["Flying like birds", "Digging to the centre of Earth", "Sailing round the world", "Climbing Mount Everest"], "a": 0, "x": "They dreamed of building a machine that could fly."}, {"q": "What were the brothers' first names?", "o": ["William and Oliver", "Wallace and Owen", "Wilbur and Orville", "Walter and Oscar"], "a": 2, "x": "Wilbur and Orville Wright were brothers from the American Midwest."}, {"q": "In which country did the Wright brothers live?", "o": ["Australia", "Italy", "The United States", "Brazil"], "a": 2, "x": "They were American inventors."}, {"q": "Before flying, what kind of shop did the brothers run?", "o": ["A bicycle shop", "A shipyard", "A bakery", "A toy factory"], "a": 0, "x": "They repaired and built bicycles in Dayton, Ohio."}, {"q": "How did many people feel about flying machines back then?", "o": ["Nobody had thought about it", "They thought it was easy", "Only the brothers believed in it", "They thought it was impossible"], "a": 3, "x": "Lots of people thought a flying machine would never work."}, {"q": "What do we call a machine that flies with wings and an engine?", "o": ["A bicycle", "An airplane", "A submarine", "A tractor"], "a": 1, "x": "The Wrights built the first successful powered airplane."}, {"q": "What quality helped the brothers keep trying after failures?", "o": ["Wealth", "Curiosity and determination", "Magic", "Luck only"], "a": 1, "x": "They kept asking questions and testing ideas."}, {"q": "Did the Wright brothers invent flying by working alone, or as a team?", "o": ["As a team", "Alone", "With the army", "With a big company"], "a": 0, "x": "Wilbur and Orville worked side by side."}, {"q": "Where did the brothers do their biggest flying tests?", "o": ["Hollywood", "The North Pole", "Paris, France", "Kitty Hawk, North Carolina"], "a": 3, "x": "Kitty Hawk had strong, steady winds and soft sand."}, {"q": "What does \"inventor\" mean?", "o": ["Someone who sails ships", "Someone who creates something new", "Someone who reads maps", "Someone who sells shoes"], "a": 1, "x": "Inventors turn big ideas into real things."}]}, {"t": "The Boys from Dayton", "e": "🏠", "q": [{"q": "Where was Wilbur Wright born?", "o": ["Millville, Indiana", "London, England", "Rome, Italy", "Paris, France"], "a": 0, "x": "Wilbur was born in 1867 in Millville, Indiana."}, {"q": "In which year was Wilbur born?", "o": ["1867", "1967", "1667", "1767"], "a": 0, "x": "Wilbur was born four years before Orville."}, {"q": "In which year was Orville born?", "o": ["1871", "1671", "1771", "1971"], "a": 0, "x": "Orville was born in Dayton, Ohio."}, {"q": "In which city was Orville born?", "o": ["Boston", "Dayton, Ohio", "Chicago", "Miami"], "a": 1, "x": "Dayton became the brothers' home."}, {"q": "What toy did their father bring home that sparked their interest in flight?", "o": ["A toy boat", "A toy helicopter", "A yo-yo", "A toy train"], "a": 1, "x": "It was a little helicopter powered by a twisted rubber band."}, {"q": "What powered the toy helicopter?", "o": ["Batteries", "Steam", "A tiny engine", "A twisted rubber band"], "a": 3, "x": "The rubber band spun the blades and lifted the toy."}, {"q": "What did the brothers build as young men besides bicycles?", "o": ["A rocket", "A printing press", "A submarine", "A piano"], "a": 1, "x": "They built their own printing press and printed newspapers."}, {"q": "What did the family's home have lots of that the boys loved?", "o": ["Books", "Video games", "Tractors", "Fireworks"], "a": 0, "x": "Their parents encouraged reading and thinking for themselves."}, {"q": "What was the name of the brothers' bicycle business?", "o": ["The Wright Cycle Company", "Flyer & Sons", "Dayton Wheels", "Sky Bikes"], "a": 0, "x": "They opened it in 1892."}, {"q": "What skills from the bicycle shop helped with flying machines?", "o": ["Working with tools and balance", "Painting portraits", "Playing music", "Cooking"], "a": 0, "x": "Bicycles taught them about balance, control and light, strong parts."}]}, {"t": "The Great Flying Problem", "e": "🧩", "q": [{"q": "Who was Otto Lilienthal?", "o": ["A French baker", "An American president", "A British king", "A German glider pioneer"], "a": 3, "x": "Lilienthal's glider flights inspired the Wrights."}, {"q": "What did Lilienthal teach the brothers?", "o": ["How to dig tunnels", "How to sail", "That people could glide through the air", "How to bake bread"], "a": 2, "x": "His gliding showed flight was possible."}, {"q": "What did the brothers study first: control or engines?", "o": ["Control", "Colours", "Wheels", "Engines"], "a": 0, "x": "They believed a pilot had to master control before adding a motor."}, {"q": "What did Wilbur believe a pilot must learn first?", "o": ["To swim", "To drive a car", "To glide", "To sail"], "a": 2, "x": "Learning to glide came before adding a motor."}, {"q": "Which bird-like skill did the brothers want their machine to copy?", "o": ["Building nests", "Laying eggs", "Singing", "Balancing and turning in the air"], "a": 3, "x": "Birds twist their wings to steer."}, {"q": "What are the three big problems of flight?", "o": ["Lift, power and control", "Speed, size and cost", "Wheels, doors and windows", "Colour, sound and taste"], "a": 0, "x": "The brothers worked on each one."}, {"q": "What is lift?", "o": ["The sound of an engine", "A kind of elevator", "The upward force that holds a plane up", "A type of wheel"], "a": 2, "x": "Wings create lift when air flows over them."}, {"q": "What did the brothers write to the Smithsonian to get?", "o": ["A free airplane", "A pet bird", "A map of Mars", "Information about flight"], "a": 3, "x": "They asked for papers on flying research."}, {"q": "Why were earlier flying machines failing?", "o": ["They were made of chocolate", "They were too small to see", "They couldn't be controlled", "They were too colourful"], "a": 2, "x": "Control const cl=document.getElementById('cl');for(let i=0;i<7;i++){const e=document.createElement('i');e.style.top=(4+Math.random()*60)+'%';e.style.transform='scale('+(.6+Math.random()*.9)+')';e.style.animationDuration=(60+Math.random()*80)+'s';e.style.animationDelay=(-Math.random()*120)+'s';cl.appendChild(e)}
const THEME={
 cheers:['Clear skies!','Smooth landing!','Right on course!','Lift-off!','Soaring high!'],
 oops:['A bit of turbulence!','Try another heading!','Almost airborne!','Keep flying!'],
 nextText:'Next flight ➜',finishText:'Land & see my score ➜',
 colors:['#ffffff','#fff3cf','#f7edd1','#d9e9f5','#e9a22b'],

 tile(i,r,b){const bd=b==null?'':(b===10?'🥇':b>=7?'🥈':b>=4?'🥉':'✈');return `<span class="stub"><span><small>FLIGHT</small><b>${i+1}</b></span></span><span class="mid"><b>${r.t}</b><span>10 questions${b!=null?' · best '+b+'/10':''}</span></span><span class="em">${r.e}</span><span class="pin">${bd}</span>`},
 opt(k,t){return `<span class="l">${'ABCD'[k]}</span><span>${t}</span>`},
 qlabel(n,t){return 'Q '+n+'/'+t},
 score(n){document.getElementById('sc').textContent='★ '+n},

 feedback(ok,msg,streak,x){return `<b>${ok?'✓ '+msg:'• '+msg}${ok&&streak>=3?' <span class="streak">'+streak+' in a row!</span>':''}</b>${x}<span class="stop">— MESSAGE RECEIVED. STOP.</span>`},
 rank(s){return s===10?['🏆','Ace Pilot!','A perfect flight! Wilbur and Orville would be proud.']:s>=7?['🥇','Skilled Aviator','Great flying! You really know your Wright brothers.']:s>=4?['🥈','Cadet Flyer','Nice work! Fly again to earn your wings.']:['🥉','Ground Crew','Every pilot starts on the ground. Read the book and try again!']},
 end(m,s,n){document.getElementById('md').textContent=m[0];document.getElementById('dt').textContent=m[1];document.getElementById('ds').textContent=s+' / '+n;document.getElementById('dm').textContent=m[2]},
 init(){addEventListener('resize',()=>THEME.progress(idx/(qs.length||1)))}
};
const $=s=>document.getElementById(s);
const best={};let cur=null,qs=[],idx=0,score=0,streak=0,locked=false;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tiles(){const t=$('tiles');t.innerHTML='';ROUNDS.forEach((r,i)=>{const b=document.createElement('button');b.className='tile t'+i;b.innerHTML=THEME.tile(i,r,best[i]);b.onclick=()=>start(i);t.appendChild(b)})}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));scrollTo(0,0)}
function start(i){cur=i;qs=i==='mix'?shuffle(ROUNDS.flatMap(r=>r.q)).slice(0,10):ROUNDS[i].q.slice();
 qs=shuffle(qs).map(q=>{const o=q.o.map((t,k)=>({t,c:k===q.a}));return{q:q.q,x:q.x,o:shuffle(o)}});
 idx=0;score=0;streak=0;THEME.score(0);show('play');render()}
function render(){locked=false;const q=qs[idx];
 $('rn').textContent=(cur==='mix'?'Surprise Mix':'Round '+(cur+1)+': '+ROUNDS[cur].t);
 $('qn').textContent=THEME.qlabel(idx+1,qs.length);
 $('qt').textContent=q.q;THEME.progress(idx/qs.length,idx,qs.length);
 const op=$('op');op.className='opts';op.innerHTML='';
 q.o.forEach((o,k)=>{const b=document.createElement('button');b.className='opt o'+k;b.innerHTML=THEME.opt(k,o.t);b.onclick=()=>pick(k,b);op.appendChild(b)});
 $('fb').className='fb';$('nx').style.display='none';THEME.onQuestion&&THEME.onQuestion()}
function pick(k,btn){if(locked)return;locked=true;const q=qs[idx];const ok=q.o[k].c;
 $('op').classList.add('done');const kids=$('op').children;q.o.forEach((o,i)=>{if(o.c)kids[i].classList.add('right')});
 if(ok){score++;streak++;THEME.score(score);if(streak>=3)confetti(streak>=5?120:50)}else{streak=0;btn.classList.add('wrong')}
 const c=THEME.cheers,o2=THEME.oops;
 $('fb').innerHTML=THEME.feedback(ok,ok?c[Math.floor(Math.random()*c.length)]:o2[Math.floor(Math.random()*o2.length)],streak,q.x);
 $('fb').classList.add('on');THEME.onAnswer&&THEME.onAnswer(ok,btn);$('nx').style.display='block';$('nx').textContent=idx===qs.length-1?THEME.finishText:THEME.nextText}
$('nx').onclick=()=>{idx++;if(idx>=qs.length)finish();else render()};
function finish(){THEME.progress(1,qs.length,qs.length);if(cur!=='mix')best[cur]=Math.max(best[cur]||0,score);
 const m=THEME.rank(score);THEME.end(m,score,qs.length);show('done');if(score>=7)confetti(score===10?220:120);tiles()}
$('again').onclick=()=>start(cur);$('hm').onclick=()=>{tiles();show('home')};$('bk').onclick=()=>{tiles();show('home')};$('mix').onclick=()=>start('mix');
tiles();THEME.init&&THEME.init();
const cv=$('cv'),cx=cv.getContext('2d');let P=[],run=false;
function sz(){cv.width=innerWidth;cv.height=innerHeight}sz();addEventListener('resize',sz);
function confetti(n){for(let i=0;i<n;i++)P.push({x:Math.random()*cv.width,y:-10-Math.random()*cv.height*.3,vx:(Math.random()-.5)*3,vy:1.5+Math.random()*3.5,r:Math.random()*6.28,vr:(Math.random()-.5)*.25,s:8+Math.random()*10,c:THEME.colors[Math.floor(Math.random()*THEME.colors.length)]});if(!run){run=true;requestAnimationFrame(tick)}}
function tick(){cx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx+Math.sin(p.y/40)*.6;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;THEME.shape(cx,p.s);cx.restore()});P=P.filter(p=>p.y<cv.height+20);if(P.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}}
